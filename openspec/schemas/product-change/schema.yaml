name: product-change
version: 2
description: Product workflow with a native OpenSpec change core
artifacts:
  - id: br
    generates: br.md
    description: Shared business requirement reference
    template: br.md
    requires: []

  - id: prd
    generates: prd.md
    description: Shared product requirement reference
    template: prd.md
    requires:
      - br

  - id: proposal
    generates: proposal.md
    description: OpenSpec change proposal
    template: proposal.md
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: Executable behavior deltas
    template: spec.md
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Technical design for the change
    template: design.md
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: Traceable implementation plan
    template: tasks.md
    requires:
      - specs
      - design

  - id: feature
    generates: feature.md
    description: Post-implementation delivery record
    template: feature.md
    requires:
      - tasks

apply:
  requires: [tasks]
  tracks: tasks.md
