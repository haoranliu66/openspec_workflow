name: product-change
version: 4
description: Product workflow with a native OpenSpec change core
artifacts:
  - id: br
    generates: br.md
    description: Shared business requirement reference
    template: br.md
    requires: []

  - id: prd
    generates: prd.md
    description: Shared product requirement reference
    template: prd.md
    requires:
      - br

  - id: proposal
    generates: proposal.md
    description: OpenSpec change proposal
    template: proposal.md
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: Executable behavior deltas
    template: spec.md
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Technical design for the change
    template: design.md
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: Traceable implementation plan
    template: tasks.md
    requires:
      - specs
      - design

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Apply is an implementation action, not an artifact-completion action. After br.md, prd.md, proposal.md,
    delta specs, design.md, and tasks.md are complete or materially changed, end the current execution turn,
    show this change ID and the implementation-plan summary, and wait for a later user message. The original
    request, artifact generation, /opsx:continue, /opsx:ff, or an unqualified "continue" is not authorization.
    A later `/opsx:apply <change>`, `确认实施 <change>`, or an unambiguous confirmation to a single-change
    authorization prompt authorizes only that change. Material planning changes invalidate prior authorization;
    formatting, link repair, evidence attachment, and checkbox/status notes do not. This is AI/team governance,
    not an approval artifact or a Schema, script, or CI proof. After implementation, prepare change-local
    verification material for team review. Implementation authorization does not authorize formal close; present
    the verification summary and wait for later explicit close authorization before running workflow close.
