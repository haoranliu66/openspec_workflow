schema: product-change

context: |
  Shared BR, PRD, and FEATURE records live in docs/requirements/REQ-<id>-<slug>/ and can govern multiple OpenSpec changes. SPEC.md is generated navigation; current behavior lives in openspec/specs/<capability>/spec.md, while a change only owns its deltas under openspec/changes/<change>/specs/<capability>/spec.md. Archived changes are immutable.
rules:
  br:
    - Link the single shared BR instead of copying it into a change.
    - Record only the target ID, delivery slice, evidence status, and blockers.
  prd:
    - Link the shared PRD and identify the independently deliverable slice.
    - Keep outcome-level acceptance here; executable WHEN/THEN scenarios belong only in specs.
  proposal:
    - Link the governing BR and PRD while keeping the proposal independently releasable.
    - Use the native Why, What Changes, Capabilities, and Impact sections.
  specs:
    - Use behavior-first SHALL/MUST requirements and precise WHEN/THEN scenarios.
    - Trace PRD acceptance IDs and historical changes without modifying archives.
  design:
    - design.md is the only technical design; trace decisions to requirement IDs.
  tasks:
    - Order numbered checkbox work by dependency and record independently verifiable evidence.
  feature:
    - Record only delivered behavior backed by evidence, then synchronize and archive the change.
