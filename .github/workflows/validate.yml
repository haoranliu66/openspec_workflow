name: 校验工作流

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --global @fission-ai/openspec@1.5.0
      - run: npm test
      - run: npm run index
      - run: git diff --exit-code -- SPEC.md
      - run: npm run check
      - run: npm run validate:schemas
