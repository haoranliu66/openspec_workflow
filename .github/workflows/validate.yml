name: 校验工作流
on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.19.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm install --global @fission-ai/openspec@1.5.0
      - run: npm run build
      - name: Assert TypeScript source boundary
        shell: bash
        run: |
          mapfile -t unexpected < <(find bin lib scripts tests -type f -name '*.js' -print)
          if (( ${#unexpected[@]} > 0 )); then
            printf 'JavaScript is only allowed in generated dist/:\n%s\n' "${unexpected[@]}"
            exit 1
          fi
      - run: npm run test:compiled
      - run: npm run index:compiled
      - run: git diff --exit-code -- SPEC.md openspec/change-history.json
      - run: npm run validate:schemas:compiled
      - run: npm run check:compiled
      - run: git diff --check
